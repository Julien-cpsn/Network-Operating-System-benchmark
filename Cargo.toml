[package]
name = "NOS-QEMU-benchmark"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[dependencies]
tokio = { version = "1.54.1",features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "process"]}
tokio-util = { version = "0.7.20", features = ["rt"] }
futures = "0.3.34"

serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_json = "1.0.154"

dotenv = "0.15.0"

cidr = { version = "0.3.2", features = ["serde"] }
rexpect = "0.7.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }

clap = { version = "4.6.7", features = ["derive", "color"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }

anyhow = "1.0.104"
once_cell = "1.21.4"
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
indexmap = { version = "2.14.2", features = ["serde"] }
walkdir = "2.5.0"
ctrlc = "3.5.2"
rpassword = "7.5.4"
shlex = "2.0.1"
csv = "1.4.0"
chrono = "0.4.45"
flate2 = "1.1.10"
tempfile = "3.27.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "fmt"] }
tracing-appender = "0.2.5"

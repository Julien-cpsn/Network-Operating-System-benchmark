# ===== Multi-operator =====

[Multi-operator]
    # 4 ASes (AS65001..AS65004), each a ring of 4 routers: R1 - R2 - R3 - R4 - R1.
    # R1 = ingress border router (towards Client), R3 = egress border router (towards Server).
    # Addressing: intra-AS link i of AS n = 10.n.i.0/24 ; inter-AS link AS n <-> AS n+1 = 172.16.<n><n+1>.0/24
    # BGP   = eBGP only (as in Double): every router is its own AS, 650<n><k> for AS<n> Router <k> (e.g. AS2 Router 3 = AS65023),
    #         sessions only between directly connected routers, no IGP.
    # Mixed = per operator AS65001..AS65004: OSPF inside each AS + full-mesh iBGP (next-hop-self) + eBGP between ASes.
    supported_routing_protocols = ["static", "RIP", "OSPF", "BGP", "Mixed"]
    failure_events = [
        { type = "link", link_index = 6, happens_at = 30 }  # AS2 R1 <-> AS2 R2: RIP/OSPF/BGP/Mixed reroute via AS2 R4
    ]

    [Multi-operator.network]
    physical_links = [
        { node_a = "Client", adapter_a = 0, node_b = "AS1 Router 1", adapter_b = 5 },  # [0] Client <-> AS1
        { node_a = "AS1 Router 1", adapter_a = 3, node_b = "AS1 Router 2", adapter_b = 3 },  # [1] AS1 R1 <-> R2
        { node_a = "AS1 Router 2", adapter_a = 4, node_b = "AS1 Router 3", adapter_b = 3 },  # [2] AS1 R2 <-> R3
        { node_a = "AS1 Router 3", adapter_a = 4, node_b = "AS1 Router 4", adapter_b = 3 },  # [3] AS1 R3 <-> R4
        { node_a = "AS1 Router 1", adapter_a = 4, node_b = "AS1 Router 4", adapter_b = 4 },  # [4] AS1 R1 <-> R4
        { node_a = "AS1 Router 3", adapter_a = 5, node_b = "AS2 Router 1", adapter_b = 5 },  # [5] AS1 <-> AS2
        { node_a = "AS2 Router 1", adapter_a = 3, node_b = "AS2 Router 2", adapter_b = 3 },  # [6] AS2 R1 <-> R2
        { node_a = "AS2 Router 2", adapter_a = 4, node_b = "AS2 Router 3", adapter_b = 3 },  # [7] AS2 R2 <-> R3
        { node_a = "AS2 Router 3", adapter_a = 4, node_b = "AS2 Router 4", adapter_b = 3 },  # [8] AS2 R3 <-> R4
        { node_a = "AS2 Router 1", adapter_a = 4, node_b = "AS2 Router 4", adapter_b = 4 },  # [9] AS2 R1 <-> R4
        { node_a = "AS2 Router 3", adapter_a = 5, node_b = "AS3 Router 1", adapter_b = 5 },  # [10] AS2 <-> AS3
        { node_a = "AS3 Router 1", adapter_a = 3, node_b = "AS3 Router 2", adapter_b = 3 },  # [11] AS3 R1 <-> R2
        { node_a = "AS3 Router 2", adapter_a = 4, node_b = "AS3 Router 3", adapter_b = 3 },  # [12] AS3 R2 <-> R3
        { node_a = "AS3 Router 3", adapter_a = 4, node_b = "AS3 Router 4", adapter_b = 3 },  # [13] AS3 R3 <-> R4
        { node_a = "AS3 Router 1", adapter_a = 4, node_b = "AS3 Router 4", adapter_b = 4 },  # [14] AS3 R1 <-> R4
        { node_a = "AS3 Router 3", adapter_a = 5, node_b = "AS4 Router 1", adapter_b = 5 },  # [15] AS3 <-> AS4
        { node_a = "AS4 Router 1", adapter_a = 3, node_b = "AS4 Router 2", adapter_b = 3 },  # [16] AS4 R1 <-> R2
        { node_a = "AS4 Router 2", adapter_a = 4, node_b = "AS4 Router 3", adapter_b = 3 },  # [17] AS4 R2 <-> R3
        { node_a = "AS4 Router 3", adapter_a = 4, node_b = "AS4 Router 4", adapter_b = 3 },  # [18] AS4 R3 <-> R4
        { node_a = "AS4 Router 1", adapter_a = 4, node_b = "AS4 Router 4", adapter_b = 4 },  # [19] AS4 R1 <-> R4
        { node_a = "Server", adapter_a = 0, node_b = "AS4 Router 3", adapter_b = 5 },  # [20] AS4 <-> Server
    ]

    [Multi-operator.network.nodes.Client]
    vcpu = 8
    ram = 2048
    ip = "10.0.1.2/24"
    x = -650
    y = 0

    [Multi-operator.network.nodes.Server]

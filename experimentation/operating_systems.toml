[BSDRP-BIRD2]
    input_ready = ":~"
    login = "root"
    #password = null
    network_stack = "FreeBSD network stack"
    routing_stack = "BIRD2"
    interface_prefix = [
        ["E1000", "em"],
        ["RTL8139", "re"],
        ["VirtIO", "vtnet"]
    ]
    interfaces_start_at = 0
    images_path = ["/home/jcaposie/survey/vm/BSDRP/BSDRP-2.2-full-amd64.img"]
    resources_monitor_commands = [
        """bash << EOF
pg=\\$(sysctl -n vm.stats.vm.v_page_size)
prev=\\$(sysctl -n kern.cp_time)
printf "Total (MiB)\\tAvailable (MiB)\\tUsed (MiB)\\tCPU (perc)\\n"
""",
        { expect = "", send = """while :; do
    sleep 1
    cur=\\$(sysctl -n kern.cp_time)
    mem=\\$(sysctl -n -i vm.stats.vm.v_page_count vm.stats.vm.v_free_count \
          vm.stats.vm.v_inactive_count kstat.zfs.misc.arcstats.size kstat.zfs.misc.arcstats.c_min)
""" },
        { expect = "", send = """    echo \\$prev \\$cur \\$mem | awk -v pg="\\$pg" '{
        for (k = 1; k <= 5; k++) { d[k] = \\$(k+5) - \\$k; w += d[k] }
        arc = (\\$14 + 0 > \\$15 + 0) ? \\$14 - \\$15 : 0
        tot = \\$11 * pg; av = (\\$12 + \\$13) * pg + arc
        printf "%.1f\\t%.1f\\t%.1f\\t%.1f\\n", tot/1048576, av/1048576, (tot-av)/1048576,
""" },
        { expect = "", send = """               (w > 0 ? 100*(w-d[5])/w : 0)
    }'
    prev=\\$cur
done
EOF""" },
        { expect = "", wait = 60_000_000 },
        { expect = "", control = 'c' }
    ]


            { expect = "OS10(config-router-neighbor", send = "remote-as {REMOTE_AS}" },
            { expect = "OS10(config-router-neighbor", send = "address-family ipv4 unicast", assert_true = [["NEXT_HOP_SELF", "true"]] },
            { expect = "OS10(config-router-neighbor", send = "next-hop-self", assert_true = [["NEXT_HOP_SELF", "true"]] },
            { expect = "OS10(config-router-neighbor", send = "exit", assert_true = [["NEXT_HOP_SELF", "true"]] },

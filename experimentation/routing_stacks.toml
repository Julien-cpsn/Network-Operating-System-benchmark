["BIRD2"]
    start = [
        { send = "sysrc frr_enable=NO", assert_true = [["OS", "BSDRP-BIRD2"]] },
        { send = "sysrc bird_enable=YES", assert_true = [["OS", "BSDRP-BIRD2"]] },
        "rm /usr/local/etc/bird.conf",
        """cat <<EOF >> /usr/local/etc/bird.conf
router id {ROUTER_ID};

protocol device {
}

protocol direct {
    ipv4;
}

protocol kernel {
    ipv4 {
        import all;
        export all;
    };
}
EOF"""
    ]
    RIP = {
        start = [
            """cat <<EOF >> /usr/local/etc/bird.conf
protocol rip {
    ipv4 {
        import all;
        export all;
    };

    RIP_INTERFACES
}
EOF"""
        ],
        enable_interface = [
            "sed -i .orig 's|RIP_INTERFACES|interface \"{INTERFACE_PREFIX}{INTERFACE}\" {\\n\\t\\tversion 2;\\n\\t\\tmode multicast;\\n\\t\\tupdate time 30;\\n\\t};\\n\\tRIP_INTERFACES|' /usr/local/etc/bird.conf"
        ],
        add_network = [],
        stop = [
            "sed -i .orig 's/RIP_INTERFACES//' /usr/local/etc/bird.conf"
        ]
    }

    OSPF = {
        start = [
            """cat <<EOF >> /usr/local/etc/bird.conf
protocol ospf v2 ospf1 {
    ipv4 {
        import all;
        export where source != RTS_BGP;
    };

    area 0 {
        OSPF_INTERFACES
    };
}
EOF"""
        ],
        add_area = [
            "sed -i .orig 's|OSPF_INTERFACES|interface \"{INTERFACE_PREFIX}{INTERFACE}\" {\\n\\t\\ttype broadcast;\\n\\t\\t};\\n\\t\\tOSPF_INTERFACES|' /usr/local/etc/bird.conf"
        ],
        add_network = [],
        stop = [
            "sed -i .orig 's/OSPF_INTERFACES//' /usr/local/etc/bird.conf"
        ]
    }
    BGP = {
        start = [
        # BIRD accepts a single 'neighbor' per 'protocol bgp': one protocol instance per neighbor, sharing a template.
        # Routes learned via BGP are always re-exported (needed for transit ASes), locally originated ones only if listed.
        """cat <<EOF >> /usr/local/etc/bird.conf
filter bgp_export {
    if source = RTS_BGP then accept;
    BGP_NETWORKS
    reject;
}

template bgp bgp_peer {
    local as {LOCAL_AS};
}
EOF"""
        ],
        add_neighbor = [
            """cat <<EOF >> /usr/local/etc/bird.conf
protocol bgp from bgp_peer {
    neighbor {NEIGHBOR_ADDRESS} as {REMOTE_AS};
    ipv4 {
        import all;
        export filter bgp_export;
        BGP_NEXT_HOP_SELF
    };
}
EOF""",
            { send = "sed -i .orig 's/BGP_NEXT_HOP_SELF/next hop self;/' /usr/local/etc/bird.conf", assert_true = [["NEXT_HOP_SELF", "true"]] },
            "sed -i .orig 's/BGP_NEXT_HOP_SELF//' /usr/local/etc/bird.conf",
        ],
        add_network_to_advertise = [
            "sed -i .orig 's|BGP_NETWORKS|if net = {DISTANT_NETWORK} then accept;\\nBGP_NETWORKS|' /usr/local/etc/bird.conf"
        ],
        stop = [
            "sed -i .orig 's/BGP_NETWORKS//' /usr/local/etc/bird.conf",
        ]
    }
    stop = [
        "service bird start",
        "birdc configure"
    ]

["DNOS10 routing stack"]

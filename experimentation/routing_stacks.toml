            { expect = "(config-router)# ", send = "exit" }
        ]
    }
    stop = [
        { expect = "(config)# ", send = "exit" },
        { expect = "# ", send = "write memory" },
        { expect = "# ", send = "end" },
        { expect = "# ", send = "exit" },
    ]

["MikroTik routing stack"]
    start = []
    RIP = {
        start = [
            "routing rip set redistribute-connected=yes\r\n"
        ],
        enable_interface = [
            "routing rip interface add interface={INTERFACE_PREFIX}{INTERFACE} receive=v2 send=v2\r\n"
        ],
        add_network = [
            "routing rip network add network={DISTANT_NETWORK}\r\n"
        ],
        stop = []
    }
    OSPF = {
        start = [
            "routing ospf instance add name=ospf-instance-1 router-id={ROUTER_ID}\r\n"
        ],
        add_area = [
            "routing ospf area add name=area{AREA} instance=ospf-instance-1 area-id={AREA}.{AREA}.{AREA}.{AREA}\r\n",
        ],
        add_network = [
            "routing ospf network add area=area{AREA} network={DISTANT_NETWORK}\r\n"
        ],
        stop = []
    }
    BGP = {
        start = [
            "routing bgp instance add name=bgp-instance-1 as={LOCAL_AS} router-id={ROUTER_ID}\r\n"
        ],
        add_neighbor = [
            # Peer named after its address: several iBGP peers share the same remote AS
            "routing bgp peer add name=bgp-peer-{NEIGHBOR_ADDRESS} instance=bgp-instance-1 remote-address={NEIGHBOR_ADDRESS} remote-as={REMOTE_AS}\r\n",
            # next_hop_self is only set on iBGP sessions, which may be non-directly connected (multihop + recursive next-hop)
            { send = "routing bgp peer set [find remote-address={NEIGHBOR_ADDRESS}] nexthop-choice=force-self multihop=yes\r\n", assert_true = [["NEXT_HOP_SELF", "true"]] },
        ],
        add_network_to_advertise = [
            "ip route add dst-address={DISTANT_NETWORK} type=blackhole\r\n",
            "routing bgp network add network={DISTANT_NETWORK}\r\n",
        ],
        stop = []
    }
    stop = []
["FRR"]
    start = [
        # DANOS
        { send = "sudo /usr/lib/frr/ripd -d", assert_true = [["OS", "DANOS"], ["ROUTING_PROTOCOL_RIP", "true"]] },
        #{ send = "sudo /usr/lib/frr/ospfd -d", assert_true = [["OS", "DANOS"], ["ROUTING_PROTOCOL_OSPF", "true"]] },
        #{ send = "sudo /usr/lib/frr/bgpd -d", assert_true = [["OS", "DANOS"], ["ROUTING_PROTOCOL_BGP", "true"]] },

        # BSDRP FRR
        { send = "sysrc bird_enable=NO", assert_true = [["OS", "BSDRP-FRR"]] },
        { send = "sysrc frr_enable=YES", assert_true = [["OS", "BSDRP-FRR"]] },
        { send = "sysrc frr_daemons=\"zebra ripd\"", assert_true = [["OS", "BSDRP-FRR"], ["ROUTING_PROTOCOL_RIP", "true"], ["ROUTING_PROTOCOL_OSPF", "false"], ["ROUTING_PROTOCOL_BGP", "false"]] },
        { send = "sysrc frr_daemons=\"zebra ospfd\"", assert_true = [["OS", "BSDRP-FRR"], ["ROUTING_PROTOCOL_RIP", "false"], ["ROUTING_PROTOCOL_OSPF", "true"], ["ROUTING_PROTOCOL_BGP", "false"]] },
        { send = "sysrc frr_daemons=\"zebra bgpd\"", assert_true = [["OS", "BSDRP-FRR"], ["ROUTING_PROTOCOL_RIP", "false"], ["ROUTING_PROTOCOL_OSPF", "false"], ["ROUTING_PROTOCOL_BGP", "true"]] },
        { send = "sysrc frr_daemons=\"zebra ripd ospf\"", assert_true = [["OS", "BSDRP-FRR"], ["ROUTING_PROTOCOL_RIP", "true"], ["ROUTING_PROTOCOL_OSPF", "true"], ["ROUTING_PROTOCOL_BGP", "false"]] },
        { send = "sysrc frr_daemons=\"zebra ospfd bgpd\"", assert_true = [["OS", "BSDRP-FRR"], ["ROUTING_PROTOCOL_RIP", "false"], ["ROUTING_PROTOCOL_OSPF", "true"], ["ROUTING_PROTOCOL_BGP", "true"]] },
        { send = "sysrc frr_daemons=\"zebra ripd bgpd\"", assert_true = [["OS", "BSDRP-FRR"], ["ROUTING_PROTOCOL_RIP", "true"], ["ROUTING_PROTOCOL_OSPF", "false"], ["ROUTING_PROTOCOL_BGP", "true"]] },
        { send = "sysrc frr_daemons=\"zebra ripd ospfd bgpd\"", assert_true = [["OS", "BSDRP-FRR"], ["ROUTING_PROTOCOL_RIP", "true"], ["ROUTING_PROTOCOL_OSPF", "true"], ["ROUTING_PROTOCOL_BGP", "true"]] },
        { send = "/usr/local/etc/rc.d/frr start", assert_true = [["OS", "BSDRP-FRR"]] },

        # Debian FRR
        { send = "sudo /usr/lib/frr/ripd -d", assert_true = [["OS", "Debian-FRR"], ["ROUTING_PROTOCOL_RIP", "true"]] },
        { send = "sudo /usr/lib/frr/ospfd -d", assert_true = [["OS", "Debian-FRR"], ["ROUTING_PROTOCOL_OSPF", "true"]] },
        { send = "sudo /usr/lib/frr/bgpd -d", assert_true = [["OS", "Debian-FRR"], ["ROUTING_PROTOCOL_BGP", "true"]] },
        { wait = 5_000, assert_true = [["OS", "Debian-FRR"]] },

        # SONiC only
        { send = "docker exec -it bgp bash", assert_true = [["OS", "SONiC"]] },
        { expect = ":/", send = "/usr/lib/frr/ripd -d", assert_true = [["OS", "SONiC"], ["ROUTING_PROTOCOL_RIP", "true"]] },
        { expect = ":/", send = "/usr/lib/frr/ospfd -d", assert_true = [["OS", "SONiC"], ["ROUTING_PROTOCOL_OSPF", "true"]] },
        { expect = ":/", send = "exit", assert_true = [["OS", "SONiC"]] },
        { send = "sleep 15", assert_true = [["OS", "SONiC"]] },

        "sudo vtysh",
        { expect = "# ", send = "configure terminal" },
        { expect = "(config)# ", send = "route-map BGP-PERMIT-ALL permit 10", assert_true = [["ROUTING_PROTOCOL_BGP", "true"]] },
        { expect = "(config-route-map)# ", send = "exit", assert_true = [["ROUTING_PROTOCOL_BGP", "true"]]  },
    ]
    RIP = {
        start = [],
        enable_interface = [
            { expect = "(config)# ", send = "interface {INTERFACE_PREFIX}{INTERFACE}" },
            { expect = "(config-if)# ", send = "ip rip send version 2" },
            { expect = "(config-if)# ", send = "ip rip receive version 2" },
            { expect = "(config-if)# ", send = "exit" }
        ],
        add_network = [
            { expect = "(config)# ", send = "router rip" },
            { expect = "(config-router)# ", send = "version 2" },
            { expect = "(config-router)# ", send = "network {DISTANT_NETWORK}" },
            { expect = "(config-router)# ", send = "redistribute connected" },
            { expect = "(config-router)# ", send = "exit" }
        ],
        stop = []
    }
    OSPF = {
        start = [
            { expect = "(config)# ", send = "router ospf" },
            { expect = "(config-router)# ", send = "router-id {ROUTER_ID}" },
        ],
        add_area = [],
        add_network = [
            { expect = "(config-router)# ", send = "network {DISTANT_NETWORK} area {AREA}" },
        ],
        stop = [
            { expect = "(config-router)# ", send = "exit" }
        ]
    }
    BGP = {
        start = [
            { expect = "(config)# ", send = "router bgp {LOCAL_AS}" },
            { expect = "(config-router)# ", send = "bgp router-id {ROUTER_ID}" },
        ],
        add_neighbor = [
            { expect = "(config-router)# ", send = "neighbor {NEIGHBOR_ADDRESS} remote-as {REMOTE_AS}" },
            { expect = "(config-router)# ", send = "neighbor {NEIGHBOR_ADDRESS} route-map BGP-PERMIT-ALL in" },
            { expect = "(config-router)# ", send = "neighbor {NEIGHBOR_ADDRESS} route-map BGP-PERMIT-ALL out" },
            { expect = "(config-router)# ", send = "neighbor {NEIGHBOR_ADDRESS} next-hop-self", assert_true = [["NEXT_HOP_SELF", "true"]] },
        ],
        add_network_to_advertise = [
            { expect = "(config-router)# ", send = "network {DISTANT_NETWORK}" },
        ],

            { expect = "OS10(conf-if-eth", send = "ip ospf 1 area {AREA}" },
            { expect = "OS10(conf-if-eth", send = "exit" },
            { expect = "OS10(config)#", send = "end" },
            "write memory",
        ],
        add_network = [],
        stop = []
    }
    BGP = {
        start = [
            "configure terminal",
            { expect = "OS10(config)#", send = "router bgp {LOCAL_AS}" },
        ],

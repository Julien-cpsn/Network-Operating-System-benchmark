["EXOS network stack"]
    start = []
    add_ip_address = [
        "create vlan vlan{INTERFACE} tag {INTERFACE}",
        "configure vlan vlan{INTERFACE} add port {INTERFACE}",
        "configure vlan vlan{INTERFACE} ipaddress {IP_ADDRESS}/{NETWORK_LENGTH}",
        "enable ipforwarding vlan vlan{INTERFACE}",
        "enable port {INTERFACE}",
    ]
    add_static_route = []
    stop = []

["FreeBSD network stack"]
    start = [
        { send = "sysctl net.inet.ip.forwarding=1", assert_true = [["OS", "FreeBSD"]] }
    ]
    add_ip_address = [
        "ifconfig {INTERFACE_PREFIX}{INTERFACE} inet {IP_ADDRESS} netmask {MASK}"
    ]
    add_static_route = [
        "route add -net {DISTANT_NETWORK} {GATEWAY}"
    ]
    stop = []

["Linux network stack"]
    start = [
        "sudo -i",
        "echo 1 > /proc/sys/net/ipv4/ip_forward"
    ]
    add_ip_address = [
        "ip link set dev {INTERFACE_PREFIX}{INTERFACE} up",
        "ip address add {IP_ADDRESS}/{NETWORK_LENGTH} dev {INTERFACE_PREFIX}{INTERFACE}"
    ]
    add_static_route = [
        "ip route add {DISTANT_NETWORK} via {GATEWAY}"
    ]
    stop = []

["MikroTik network stack"]
    # MikroTik CLI lines end with \r\n
    start = [
        "\r\n"
    ]
    add_ip_address = [
        "ip address add address={IP_ADDRESS}/{NETWORK_LENGTH} interface={INTERFACE_PREFIX}{INTERFACE}\r\n"
    ]
    add_static_route = [
        "ip route add dst-address={DISTANT_NETWORK} gateway={GATEWAY}\r\n"
    ]
    stop = []


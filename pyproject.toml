[project]
name = "nos-benchmark"
version = "0.1.0"
description = "Network Operating System benchmark"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4",
    "pyqt6>=6.10.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14.2",
    "scikit-learn>=1.5",
    "tomli>=2.0 ; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["analysis/tests"]
